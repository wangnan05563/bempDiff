[package]
name = "bempdiff-tauri"
version = "0.1.0"
description = "BempDiff 桌面壳（Tauri 2.x + 内嵌 Java 后端 sidecar）"
edition = "2021"
rust-version = "1.77"
default-run = "BempDiff"

[lib]
name = "bempdiff_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "BempDiff"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
