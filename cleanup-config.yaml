# ============================================================
# Workspace Cleanup - 项目专用配置
# 项目：差异化对比工具 (18_comparePakage)
# 生成日期：2026-08-11
# 说明：本配置为 workspace-cleanup skill 的配置驱动分类依据。
#       仅清理「可再生的编译中间产物 / 缓存 / 运行时日志」，
#       绝不触碰源代码、配置文件、脚本、文档与用户数据。
# ============================================================

workspace:
  root: "."
  script_dir: "tooling/scripts"
  docs_dir: "docs"
  logs_dir: "logs"
  frontend_dir: ""        # 本项目无独立前端目录（Web 原型在 bempdiff/，但属源码/产物混合，单独处理）
  frontend_src_dir: "src"

# ---------- 根目录允许清单（KEEP） ----------
root_allowlist:
  extensions:
    - ".md"          # 需求/设计/测试报告等元文档
    - ".txt"         # 纯文本（core_srcs.txt 等，属项目数据）
    - ".json"        # 配置文件（config/ 下，及根级配置）
    - ".properties"  # sonar-project.properties
    - ".gitignore"
  files:
    - "README.md"
    - "CHANGELOG.md"
    - "sonar-project.properties"
    - ".gitignore"
  allowed_root_scripts: []   # 根目录不允许散落脚本

# ---------- 脚本识别 ----------
script_extensions:
  - ".py"
  - ".ps1"
  - ".bat"
  - ".sh"
  - ".vbs"
script_exclude_dirs:
  - "tooling/scripts/"
  - "bempdiff/"      # prototype 下的 .py/.sh/.bat 属原型工具链，保留

# ---------- 垃圾文件模式（仅本项目确认可安全删除者） ----------
garbage_patterns:
  # 编译中间产物目录（全删，不入归档，可 javac 重生）
  # ⚠️ 2026-09-10 修正：`build/` 已从此处移除。它曾命中 bempdiff/build/，
  #    而该目录是 electron-builder 的 buildResources 目录（内含手写 NSIS 脚本
  #    build/installer.nsh，被 package.json 的 nsis.include 引用），并非编译产物。
  #    误删导致下次打包必然失败。buildResources 类目录一律走 preserve_paths。
  compiled_dirs:
    - "out_test/"
    - "out_test_ui/"
    - "bempdiff/src-tauri/target/"     # 显式限定，避免裸 `target/` 命中其它同名目录
  # SonarQube 缓存目录
  cache_dirs:
    - ".scannerwork/"
  # bempdiff/ 下递归所有 .class（编译中间产物，与 .java 同源可重生）
  compiled_class_patterns:
    - "/bempdiff/**/*.class"
  # 运行时/结果日志（全删，可重跑测试/扫描重生）
  runtime_logs:
    - "/tooling/jmeter.log"
    - "/scan-output.log"
    - "/logs/*"            # 仅删 logs/ 内文件，保留目录与本次清理备份日志
    - "/tooling/jmeter/*.log"
    - "/tooling/jmeter/*.jtl"
    - "/bempdiff/*.log"

# ---------- 绝对保留路径（优先级最高，先于一切规则） ----------
# 命中即无条件 KEEP，任何 garbage_patterns / 推断都不得覆盖。
# 设计动机（2026-09-10 误删事故）：`build/` 曾作为编译目录模式命中
# bempdiff/build/，而那是 electron-builder 的 buildResources 目录（源码），
# 内含被 package.json → nsis.include 引用的 installer.nsh。此类目录必须显式豁免。
preserve_paths:
  # electron-builder buildResources 目录：nsis.include 指向的手写 NSIS 脚本源
  - "bempdiff/build/"
  - "bempdiff/build/installer.nsh"
  # 工具链与打包输入（体积大但必需）
  - "bempdiff/toolchain/"
  - "bempdiff/dist_input/"
  # 源码 / 配置 / 文档 / 测试夹具
  - "bempdiff/java_core/src/"
  - "bempdiff/webui/src/"
  - "bempdiff/dev-shell/"
  - "bempdiff/scripts/"
  - "config/"
  - "docs/"
  - "tooling/scripts/"
  - "perf_bemp/"
  - "release/"        # 交付安装包所在的产物根，整体不纳入自动清理（含 *.exe / *.blockmap）

# ---------- 二义性文件确认门（依赖 / 资产类） ----------
# 本项目含大量 jar/war/exe：部分属必要依赖(反编译器/JavaFX/发布包)或测试夹具，
# 绝不可静默自动删。命中即走"诊断审计 → 分类(KEEP/REVIEW/DELETE) → 显式确认 → 执行"。
# 优先级：preserve_roots > review_categories > garbage_patterns > 推断。
review_categories:
  enabled: true
  patterns:
    - "*.jar"
    - "*.war"
    - "*.exe"
  # 二义性"目录"模式：时间戳备份 / 旧构建目录等"像垃圾却可能是交付物副本"的目录。
  # 命中即走确认门（决策 10），绝不自动删。下次 `dist/BempDiff._old_*` 类备份会经用户确认。
  dir_patterns:
    - "*._old_*"
    - "*.bak"
    - "backup_*"
  reference_probe_extensions:
    - ".jmx"
    - ".py"
    - ".ps1"
    - ".bat"
    - ".sh"
    - ".md"
    - ".json"
    - ".txt"
    - ".yaml"
    - ".yml"
  require_explicit_confirm: true

# ---------- 模式推断（保守：本项目不启用自动删除推断，仅 KEEP） ----------
detection:
  enabled: false

# ---------- 服务状态检测 ----------
service_indicators:
  pid_files:
    - "logs/bempdiff.pid"
  ports:
    - 8000
    - 8080
    - 5000
  process_names:
    - "java"
  file_occupancy_probes:
    - "logs/bempdiff.pid"

# ---------- 稳定性检查 ----------
stability_check:
  enabled: true
  wait_seconds: 3
  max_recurrence: 2
  recurrence_patterns:
    - "*.log"
    - "*.jtl"
  recurrence_action: "warn"

# ---------- 跨平台命令 ----------
platform:
  current: "windows"
  # 本沙箱 safe-delete 钩子会拦截 Remove-Item/rm，故直接用 .NET 直接删除绕过
  remove_dir:  '[System.IO.Directory]::Delete("{path}",$true)'
  remove_file: '[System.IO.File]::Delete("{path}")'
  remove_file_dotnet: '[System.IO.File]::Delete("{path}")'
  remove_dir_dotnet: '[System.IO.Directory]::Delete("{path}",$true)'
  # ctypes 直调 Win32 API（最低层、最稳；本轮 2026-08-14 实测 2112 文件 0 错误）
  remove_file_ctypes: 'python -S -c "import ctypes; ctypes.windll.kernel32.DeleteFileW(r"{path}")"'
  remove_dir_ctypes: 'python -S -c "import ctypes; ctypes.windll.kernel32.RemoveDirectoryW(r"{path}")"'

# ---------- 审计与分批（沙箱删除上限护栏） ----------
audit:
  hash_algorithm: "SHA256"
  targets_file: "cleanup_targets.txt"
  slice_size: 200

# ---------- 执行策略（前台切片 vs 后台运行，成本探测自择） ----------
execution:
  # 外部进程被调度器强制终止的时长窗口（秒）；0 = 无此限制
  max_external_process_seconds: 30
  deadline_cap_seconds: 25
  resume_targets_file: "cleanup_targets.resume.txt"
  auto_background_when_overflow: true
  per_file_estimate_seconds: 0.117   # 本轮实测前台 ~0.117s/file
  # 删除策略自择：auto=先测成本再选；foreground=前台切片；background=后台运行
  delete_strategy: "auto"
  # 本沙箱对后台任务做节流（逐文件 AV 扫描），后台比前台切片更慢 → 前台优先
  background_throttled: true
  # per-file 成本探测样本量；0 = 跳过探测，用 per_file_estimate_seconds 估算
  probe_sample_size: 50

# ---------- 验证（清理后确认源码/配置完整） ----------
verification:
  # 本项目为 JavaFX 桌面应用，无 venv；验证改为「关键源/配置/脚本/文档仍存在」
  required_present:
    - "config/"
    - "tooling/scripts/"
    - "docs/"
    - "bempdiff/ui_prototype.html"
    - "sonar-project.properties"
    - "config/core_srcs.txt"
  on_failure:
    - "检查 logs/cleanup-*.log 中的 hash 记录"
    - "被删文件均为可重生编译产物：重新 javac 编译即可恢复"
    - "git checkout HEAD -- <file> 还原（若曾提交）"

# ---------- 归档 ----------
archive:
  changelog_path: "docs/cleanup-report.md"
  gitignore_path: ".gitignore"
  auto_update_gitignore: true

# ---------- 安全 ----------
safety:
  require_stopped_service: true
  backup_log_format: "cleanup-{YYYYMMDD-HHmmss}.log"
  dry_run: false
  min_confidence_to_delete: 1.0   # 仅删除 100% 确认的编译产物/日志
  max_files_per_batch: 500
  large_file_threshold_mb: 5
  special_filename_handling: "safe"
  verify_after_each_batch: true
  # 沙箱删除上限护栏（实测：单命令删数百文件会被杀；并行含大文件 chunk 触发组杀）
  max_files_per_call: 200         # 单次命令删除硬上限；超出则枚举切片分批
  parallel_delete: false          # 禁用并行删除，避免组杀
  large_file_sequential: true     # 大文件单独顺序删
  bypass_hook_mode: "ctypes"      # safe-delete 钩子拦截 Remove-Item，用 Win32 直删(ctypes)绕过，最低层最稳
