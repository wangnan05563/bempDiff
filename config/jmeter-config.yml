# ============================================================================
# BempDiff 性能压测配置（jmeter-performance-test 技能，test-only）
# ----------------------------------------------------------------------------
# 端口三分隔离：产品 server=18765 / dev 工具链=随机 / 本压测 Harness=18080。
# SUT = bempdiff/perf-harness（test-only HTTP 适配层，外部自行启动，
# 引擎不做生命周期管理 → sandbox.enabled=false，防 port_kill 误杀自管实例）。
#
# mode=jmeter（T01510，2026-10-04）：zulu21.52.15 完整 JDK 已恢复到
#   bempdiff/toolchain/zulu21.52.15-ca-jdk21.0.12-win_x64（含 java.scripting，
#   70 个模块；javac 21.0.12）。JMeter 5.6.3 --version 实测可启动，
#   故从 python_replay 回退切回原生 JMeter（可出原生 HTML 报告）。
#   下方 java_home 必须显式指向该 JDK —— jmeter.bat 找不到 java 时只报
#   "Not able to find Java executable"，排查成本高，故写死不留空。
# ============================================================================

mode: jmeter

jmeter:
  bin: "D:/code/Jmeter/apache-jmeter-5.6.3/bin/jmeter.bat"
  java_home: "D:/code/otherProjects/18_comparePakage/bempdiff/toolchain/zulu21.52.15-ca-jdk21.0.12-win_x64"
  jvm_args: []
  properties_file: ""
  cli_extra_args: ""

sandbox:
  enabled: false          # Harness 由编排层外部启动/监控/定向关停（精确 pid）
  cwd: ""
  startup_cmd: ""
  pkg: ""
  port: 18080
  health_path: "/health"
  health_retries: 30
  port_kill_retries: 0
  port_kill_wait_ms: 500
  require_new_instance: false
  env_overrides: {}
  preflight:
    enabled: false        # Harness 无限流；编排层另行单发先验 + /health 突发自检
    rate_limit_burst: 100
    burst_path: ""
    abort_on_rate_limit: true
    login_warmup: false
    login_url: ""
    login_method: "POST"
    login_body: ""
    login_max_retries: 30
  min_output_lines: 0     # 重计算端点单发即秒~分级，低样本属预期；编排层人工核对样本数
  process_match:
    mode: pid_file
    pid_file: "../.workbuddy/tmp/perf/harness.pid"
    name: ""
    cmd_substr: ""
  lifecycle:
    never_global_kill: true
    kill_tree: true
    kill_retries: 5
    kill_wait_ms: 500

resource_monitor:
  enabled: true
  match:
    mode: pid_file
    pid_file: "../.workbuddy/tmp/perf/harness.pid"
    name: ""
    cmd_substr: ""
  sample_interval_sec: 2
  duration_samples: 1500  # 2s×1500=50min 上限，压测完自动退出
  metrics: ["rss_mb", "private_mb", "cpu_percent", "handles", "threads"]
  output_csv: "../.workbuddy/tmp/perf/sut_resource.csv"
  alert:
    enabled: true
    max_rss_mb: 3000
    on_exceed: warn

target:
  base_url: "http://127.0.0.1:18080"
  default_timeout_sec: 600   # 重计算端点（big200 解析/decompile batch）单请求可达数十~数百秒
  ramp_stagger: true
  fixed_headers: {}
  auth:
    type: none
    header_name: "Authorization"
    token_source: literal
    token_env: ""
    token_file: ""
    token_literal: ""
    cookie_name: "token"
    udv_names: []

# 12 计划：线程/时长先取 JMX 原值，编排层单发先验后必要时以 duration_override 定档。
# big500_sla 跳过：磁盘仅 1.4G 无法承载 ~1GB big500 夹具（该 SLA 已于 2026-08-17 轮验证）。
phases:
  - { name: "pdf50",        jmx: "../tooling/jmeter/parse_diff_fast.jmx",      enabled: true,  threads_override: null, duration_override: null }
  - { name: "pdf100",       jmx: "../tooling/jmeter/parse_diff_fast_100.jmx",  enabled: true,  threads_override: null, duration_override: null }
  - { name: "ai_rep_exp",   jmx: "../tooling/jmeter/ai_report_export.jmx",     enabled: true,  threads_override: null, duration_override: null }
  - { name: "scale_T1",     jmx: "../tooling/jmeter/decompile_scale_T1.jmx",   enabled: true,  threads_override: null, duration_override: null }
  - { name: "scale_T2",     jmx: "../tooling/jmeter/decompile_scale_T2.jmx",   enabled: true,  threads_override: null, duration_override: null }
  - { name: "scale_T4",     jmx: "../tooling/jmeter/decompile_scale_T4.jmx",   enabled: true,  threads_override: null, duration_override: null }
  - { name: "scale_T8",     jmx: "../tooling/jmeter/decompile_scale_T8.jmx",   enabled: true,  threads_override: null, duration_override: null }
  - { name: "scale_T16",    jmx: "../tooling/jmeter/decompile_scale_T16.jmx",  enabled: true,  threads_override: null, duration_override: null }
  - { name: "conc_T1",      jmx: "../tooling/jmeter/decompile_conc_T1.jmx",    enabled: true,  threads_override: null, duration_override: null }
  - { name: "conc_T2",      jmx: "../tooling/jmeter/decompile_conc_T2.jmx",    enabled: true,  threads_override: null, duration_override: null }
  - { name: "conc_T4",      jmx: "../tooling/jmeter/decompile_conc_T4.jmx",    enabled: true,  threads_override: null, duration_override: null }
  - { name: "conc_T8",      jmx: "../tooling/jmeter/decompile_conc_T8.jmx",    enabled: true,  threads_override: null, duration_override: null }
  - { name: "big500_sla",   jmx: "../tooling/jmeter/big500_sla.jmx",           enabled: false, threads_override: null, duration_override: null }

defect_rules:
  defect_codes: ["000"]
  defect_prefixes: ["5"]
  expected_codes: []
  assertion_mismatch_is_defect: false

comparison:
  enabled: false
  baseline_jtl: ""
  key_endpoints: []
  baseline_integrity:
    enforce_same_endpoints: true
    doc_fallback_allowed: true

analysis:
  enabled: false
  inputs: []
  endpoint_groups:
    - { title: "解析/差异", label_match: "parse|diff" }
    - { title: "反编译",   label_match: "decompile" }
    - { title: "AI/报告/导出", label_match: "ai|report|export" }
  percentiles: [50, 90, 95, 99]
  output_report: "../.workbuddy/tmp/perf/comparison_report.md"

report:
  formats: ["markdown"]
  output_dir: "../.workbuddy/tmp/perf/out"
  percentiles: [50, 95, 99]
  endpoint_table: true
  group_label_prefixes: []

results:
  output_dir: "../.workbuddy/tmp/perf/out"
  format: csv
  keep_count: 10

logging:
  level: INFO
  file: "../.workbuddy/tmp/perf/engine.log"
  verbose: false
